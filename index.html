<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Buy A Day — claim a date, leave a message and become part of a permanent internet archive." />
  <meta property="og:title" content="Buy A Day" />
  <meta property="og:description" content="Pick a date from £1. Leave a message. When your day arrives, it becomes part of the archive forever." />
  <title>Buy A Day — Pick a date. Leave your mark.</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="Buy A Day home">
      <span class="brand-words">BUY<br>A DAY</span>
      <span class="brand-sun" aria-hidden="true"></span>
    </a>
    <nav class="desktop-nav" aria-label="Primary navigation">
      <a href="#/today">Today</a>
      <a href="#/dates">Buy a day</a>
      <a href="#/auctions">Auctions</a>
      <a href="#/archive">Archive</a>
      <a href="#/about">How it works</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" id="openSearch" type="button" aria-label="Search dates">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
      </button>
      <a class="button button-dark small" href="#/dates">Buy a day</a>
      <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="mobileNav" aria-label="Open menu"><span></span><span></span></button>
    </div>
    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
      <a href="#/today">Today</a><a href="#/dates">Buy a day</a><a href="#/auctions">Auctions</a><a href="#/archive">Archive</a><a href="#/about">How it works</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="shell footer-top">
      <a class="brand footer-brand" href="#/" aria-label="Buy A Day home"><span class="brand-words">BUY<br>A DAY</span><span class="brand-sun" aria-hidden="true"></span></a>
      <p>Pick a day. Say something. Keep it forever.</p>
      <nav aria-label="Footer navigation"><a href="#/today">Today</a><a href="#/dates">Dates</a><a href="#/auctions">Auctions</a><a href="#/archive">Archive</a></nav>
    </div>
    <div class="shell footer-bottom"><span>© 2026 Buy A Day</span><span>An <strong>A Brighter Internet</strong> project.</span></div>
  </footer>

  <dialog class="modal" id="claimModal">
    <button class="modal-close" data-close="claimModal" type="button" aria-label="Close">×</button>
    <div id="claimModalContent"></div>
  </dialog>

  <dialog class="modal" id="bidModal">
    <button class="modal-close" data-close="bidModal" type="button" aria-label="Close">×</button>
    <div id="bidModalContent"></div>
  </dialog>

  <dialog class="modal search-modal" id="searchModal">
    <button class="modal-close" data-close="searchModal" type="button" aria-label="Close">×</button>
    <p class="eyebrow">FIND A DATE</p>
    <h2>Jump straight to a day.</h2>
    <label class="field"><span>Date</span><input id="dateSearch" type="date" min="2027-01-01" max="2030-12-31" /></label>
    <button class="button button-blue full" id="searchDateButton" type="button">Show this date →</button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
